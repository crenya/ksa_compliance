name: Tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI (a public copy, crenya/ci-workflows): own ports + bench per job, fails when no
  # tests ran. A public repository runs on GitHub-hosted runners (free for public repositories; a fork's pull
  # request never reaches our box).
  tests:
    uses: crenya/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: ksa_compliance
      frappe_versions: '["version-16"]'
      extra_apps: |  # Payment Gateway
        payments https://github.com/frappe/payments
      runs_on: '"ubuntu-latest"'
